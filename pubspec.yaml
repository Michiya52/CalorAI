name: calor_ai
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.9.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_data_connect: ^0.1.0-dev.3
  gql: ^1.0.0

  # AI
  google_generative_ai: ^0.4.6

  # State Management & Navigation
  provider: ^6.1.2
  go_router: ^14.6.2

  # Media & Camera
  image_picker: ^1.1.2

  # Charts
  fl_chart: ^0.70.2

  # UI Utilities
  lottie: ^3.3.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.5
  flutter_dotenv: ^5.2.1
  uuid: ^4.5.1
  path_provider: ^2.1.5
  http: ^1.6.0
  url_launcher: ^6.3.2
  mobile_scanner: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/data/myfcd_full.json
    - assets/data/sgfocos_full.json
    - assets/animations/loading.json
