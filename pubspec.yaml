name: calor_ai
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: 4.7.0
  firebase_auth: 6.4.0
  cloud_firestore: 6.3.0
  firebase_data_connect: 0.3.0
  gql: ^1.0.0

  # AI
  google_generative_ai: ^0.4.6

  # State Management & Navigation
  provider: ^6.1.2
  go_router: ^14.6.2

  # Media & Camera
  image_picker: ^1.1.2

  # Charts

  # UI Utilities
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  # Utilities
  intl: 0.20.2
  shared_preferences: ^2.3.5
  flutter_dotenv: ^5.2.1
  uuid: ^4.5.1
  path_provider: ^2.1.5
  http: ^1.6.0
  url_launcher: ^6.3.2
  mobile_scanner: ^6.0.0
  fuzzywuzzy: ^0.1.0
  flutter_markdown: ^0.7.7+1
  firebase_crashlytics: 5.2.0
  firebase_performance: 0.11.3
  firebase_analytics: 12.3.0
  firebase_messaging: 16.2.0
  firebase_remote_config: 6.4.0
  firebase_app_check: 0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/data/myfcd_full.json
    - assets/data/sgfocos_full.json
    - assets/animations/loading.json

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon_v2_cropped.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon_v2_cropped.png"
